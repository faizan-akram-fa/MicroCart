kind: Deployment
metadata:
    name: api-gateway
    namespace: ecommerce-microservices
    labels:
        com.docker.compose.project: ecommerce-microservices
        com.docker.compose.service: api-gateway
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: ecommerce-microservices
            com.docker.compose.service: api-gateway
    strategy:
        type: Recreate
    template:
