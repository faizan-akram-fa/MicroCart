[server]
http_port = 3010
domain = localhost
root_url = http://localhost:3010/

[security]
admin_user = admin
admin_password = admin123
allow_embedding = true

[auth.anonymous]
enabled = true
org_role = Viewer

[auth]
disable_login_form = false

[users]
allow_sign_up = false
default_theme = dark

[log]
mode = console
level = warn

[analytics]
reporting_enabled = false
check_for_updates = false

[panels]
disable_sanitize_html = true

[feature_toggles]
enable = publicDashboards
