apiVersion: 1

datasources:
  # ── Prometheus (Metrics) ─────────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    access: proxy
    uid: prometheus-ds
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: '10s'
      exemplarTraceIdDestinations: []

  # ── Loki (Logs) ──────────────────────────────────────────────────────────────
  - name: Loki
    type: loki
    access: proxy
    uid: loki-ds
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: prometheus-ds
          matcherRegex: "service=(\\w+)"
          name: Service
          url: ''
