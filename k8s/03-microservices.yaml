# =========================================================================
# KUBERNETES MICROSERVICES LAYER (NestJS Services pulling from GHCR)
# =========================================================================

# --- 1. API GATEWAY ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/faizan-akram-fa/microcart-api-gateway:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: microcart-config
            - secretRef:
                name: microcart-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: microcart
spec:
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: api-gateway

---
# --- 2. USER SERVICE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: microcart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: ghcr.io/faizan-akram-fa/microcart-user-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: microcart-config
            - secretRef:
                name: microcart-secrets
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: "user-db"
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: microcart-secrets
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microcart-secrets
                  key: POSTGRES_PASSWORD
            - name: DB_DATABASE
              value: "user_db"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microcart-secrets
                  key: JWT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: microcart-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: microcart-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_CALLBACK_URL
              valueFrom:
                configMapKeyRef:
                  name: microcart-config
                  key: GOOGLE_CALLBACK_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: microcart
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: user-service

